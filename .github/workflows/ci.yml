name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations scripts
      - run: uv run ruff format --check src tests migrations scripts
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: |
          pnpm exec tsc --noEmit
          pnpm exec eslint .
          pnpm exec prettier --check "src/**/*.{ts,tsx,css}" "e2e/**/*.ts"
          pnpm exec vitest run

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: cd apps/api && uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: cd apps/web && pnpm exec playwright install --with-deps chromium
      - run: cd apps/web && pnpm exec playwright test
