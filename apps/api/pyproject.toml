[project]
name = "forja-api"
version = "0.1.0"
description = "Forja — construtor visual de datasets (API)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "charset-normalizer>=3.5.2",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "lark>=1.3.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-calamine>=0.9.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "sqlglot>=30.25.0",
    "uvicorn[standard]>=0.54.0",
    "xlsxwriter>=3.3.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6",
]
s3 = [
    "boto3>=1.43.121",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forja"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "C4", "PT"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity limits: spec-driven branching
    "RUF001", "RUF002", "RUF003",  # pt-BR text has ambiguous-looking unicode on purpose
    "PLC0415",  # local imports used to break import cycles
    "PLR0917",  # codegen callbacks share a positional signature
    "RUF012",  # pydantic models (via NodeConfig) use mutable defaults safely
    "N818",  # ImportError_/ValueError_ mirror builtin names on purpose
    "UP046", "UP047",  # explicit Generic/TypeVar kept for readability
    "PLW0603",  # module-level engine singleton
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["forja"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["python_calamine.*", "charset_normalizer.*", "xlsxwriter.*", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
