# SOWA — ambiente completo: API + web + Postgres (metadados). Arquivos em volume local (FileStorage local).
# `docker compose up --build` e abra http://localhost:5173 (portas do host: SOWA_API_PORT, SOWA_WEB_PORT)
# Arquivos no MinIO (S3): `docker compose --profile s3 up --build` com SOWA_STORAGE=s3 (ver .env.example).
services:
  api:
    build: ./apps/api
    environment:
      SOWA_DATA_DIR: /data
      SOWA_DATABASE_URL: postgresql+psycopg://sowa:sowa@postgres:5432/sowa
      SOWA_CORS_ORIGINS: '["http://localhost:5173"]'
      # Token de acesso: vazio = gerado em /data/token. Endereço: docker compose exec api uv run python -m sowa.cli token
      SOWA_TOKEN: ${SOWA_TOKEN:-}
      SOWA_WEB_URL: http://localhost:${SOWA_WEB_PORT:-5173}
      SOWA_STORAGE: ${SOWA_STORAGE:-local}
      SOWA_S3_BUCKET: sowa
      SOWA_S3_ENDPOINT_URL: http://minio:9000
      SOWA_S3_REGION: us-east-1
      SOWA_S3_CREATE_BUCKET: "true"
      AWS_ACCESS_KEY_ID: sowa
      AWS_SECRET_ACCESS_KEY: sowa-minio
    volumes:
      - sowa-data:/data
    ports:
      - "${SOWA_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      SOWA_API_URL: http://api:8000
    ports:
      - "${SOWA_WEB_PORT:-5173}:5173"
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sowa
      POSTGRES_PASSWORD: sowa
      POSTGRES_DB: sowa
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sowa"]
      interval: 5s
      retries: 10

  # MinIO deixou de publicar imagens no Docker Hub/quay; esta é a build da Chainguard (fixada pelo digest).
  # O bucket é criado pela API (SOWA_S3_CREATE_BUCKET).
  minio:
    profiles: ["s3"]
    image: chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    user: root  # o volume nomeado nasce como root; a imagem roda como 65532
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sowa
      MINIO_ROOT_PASSWORD: sowa-minio
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  sowa-data:
  pg-data:
  minio-data:
